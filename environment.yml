name: climate_futures
channels:
  - conda-forge
dependencies:
  # Core scientific computing
  - python=3.12
  - numpy
  - scipy
  - pandas
  - xarray
  - netcdf4
  - zarr

  # Geospatial
  - geopandas
  - rasterio
  - rioxarray
  - shapely
  - pyogrio
  - cartopy  # NEW: Required for mapping and visualization

  # Visualization
  - matplotlib
  - plotnine

  # Distributed computing
  - dask

  # Climate data specific
  - cftime

  # Data access
  - intake
  - intake-esm
  - intake-xarray
  - s3fs
  - aiobotocore

  # Jupyter
  - ipykernel
  - jupyterlab
  - jupyter_client
  - ipython
  - pip

  # Utilities
  - pydantic
  - requests
  - beautifulsoup4
  - yaml
  - contourpy
